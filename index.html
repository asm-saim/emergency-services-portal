<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/logo-dark.png" type="image/x-icon">
    <title>Emergency Hotline</title>
    <!-- daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <!-- navbar -->
    <div class="max-w-7xl mx-auto py-4 flex justify-between items-center">
        <div class="flex justify-start items-center gap-2">
            <img class="w-10" src="./assets/logo.png" alt="">
            <h1 class="font-extrabold text-lg text-[#006747] leading-[1.1]">Emergency<br>Service</h1>
        </div>

        <div class="flex items-center gap-5">
            <div class="flex justify-start items-center gap-2 bg-[#ecfff0] px-5 py-2  rounded-3xl">
                <p class="font-bold text-base">1</p>
                <img class="w-6" src="./assets/heart.png" alt="">
            </div>
            <div class="flex justify-start items-center gap-2 bg-[#ecfff0] px-5 py-2  rounded-3xl">
                <p class="font-bold text-base">100</p>
                <img class="w-6" src="./assets/coin.png" alt="">
            </div>
            <div class="bg-[#00A63E] px-4 py-2  rounded-3xl">
                <h1 class="text-white text-base font-medium"><span>2</span> Copy</h1>
            </div>

        </div>


    </div>

    <!-- Hero section -->
    <div class="h-[220px] w-full mx-auto text-center
     bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223] pt-4">
        <img src="./assets/logo-dark.png" class="w-28 mx-auto" alt="">
        <h1 class="font-bold text-4xl text-[#FFFFFF]">Emergency Service Directory</h1>
        <P class="font-semibold text-base pt-4 text-[#FFFFFF]">Government Emergency Services at Your Fingertip - A
            Project by Government of the People's Republic of Bangladesh</P>
    </div>
    <!-- cart section -->
    <div class=" border-1 border-red-700 bg-[#ecfff0]">
        <div class="max-w-7xl mx-auto">
            <!-- cards -->
            <div class="card bg-base-100 w-72 shadow-2xl m my-10 ">
                <figure class="pt-5 flex justify-between items-center px-5">
                    <img src="./assets/emergency.png" alt="Shoes" class="w-12 bg-red-100 rounded-md p-2" />
                    <i class="fa-regular fa-heart text-xl"></i>
                </figure>
                <div class="p-5 items-start text-start">
                    <h2 class="card-title font-bold">National Emergency Number</h2>
                    <p class="text-sm">National Emergency</p>
                    <h2 class="card-title mt-3 font-bold text-2xl">999</h2>
                    <p class="text-sm my-2 py-[0.15rem] px-3 bg-slate-200 rounded-lg inline">All</p>
                    <div class="flex gap-2 w-full mt-3">
                        <button
                            class="btn-primary py-1 text-sm flex-1 bg-transparent border-2 border-gray-300 text-gray-500 rounded-lg"><i
                                class="fa-regular fa-copy"></i> Copy</button>
                        <button
                            class="btn-primary text-sm flex-1 bg-[#00a63e] text-[#ffffff] border-none rounded-lg"><i class="fa-solid fa-phone"></i>  Call</button>
                    </div>
                </div>
            </div>
        </div>

    </div>


    <!-- script -->
    <script src="script.js"></script>
</body>

</html>
