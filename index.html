<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Hotline</title>
    <!-- daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <!-- navbar -->
    <div class="border-1 border-red-500 max-w-7xl mx-auto p-2 flex justify-between items-center">
        <div class="flex justify-start items-center gap-2">
            <img class="w-10" src="./assets/logo.png" alt="">
            <h1 class="font-extrabold text-lg text-[#006747] leading-[1.1]">Emergency<br>Service</h1>
        </div>

        <div class="flex items-center gap-5">
            <div class="flex justify-start items-center gap-2 bg-[#ecfff0] px-5 py-2  rounded-3xl">
                <p class="font-bold text-base">1</p>
                <img class="w-6" src="./assets/heart.png" alt="">
            </div>
            <div class="flex justify-start items-center gap-2 bg-[#ecfff0] px-5 py-2  rounded-3xl">
                <p class="font-bold text-base">100</p>
                <img class="w-6" src="./assets/coin.png" alt="">
            </div>
            <div class="bg-[#00A63E] px-4 py-2  rounded-3xl">
                <h1 class="text-white text-base font-medium"><span>2</span> Copy</h1>
            </div>

        </div>


    </div>



    <!-- script -->
    <script src="script.js"></script>
</body>

</html>
